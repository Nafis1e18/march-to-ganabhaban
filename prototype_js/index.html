<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>March to Ganabhaban</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070f;
    font-family:"Segoe UI",system-ui,sans-serif;color:#e8e8e8;
    touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    background:#05070f;touch-action:none}

  /* ---- touch controls: only shown on touch devices ---- */
  #pad{position:fixed;inset:0;pointer-events:none;display:none}
  body.touch #pad{display:block}
  .btn{position:absolute;pointer-events:auto;display:flex;align-items:center;
    justify-content:center;border-radius:50%;font-weight:700;letter-spacing:.5px;
    background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.22);
    color:#fff;backdrop-filter:blur(2px);transition:transform .05s,background .05s}
  .btn.on{background:rgba(255,255,255,.3);transform:scale(.93)}
  #bBack{left:4vmin;bottom:5vmin;width:17vmin;height:17vmin;font-size:5vmin}
  #bHit {right:23vmin;bottom:5vmin;width:19vmin;height:19vmin;font-size:4.4vmin;
         background:rgba(214,40,40,.28);border-color:rgba(255,120,120,.45)}
  #bJump{right:3vmin;bottom:13vmin;width:19vmin;height:19vmin;font-size:4.4vmin;
         background:rgba(0,160,80,.28);border-color:rgba(120,255,170,.45)}

  /* ---- rotate-to-landscape nag ---- */
  #rot{position:fixed;inset:0;background:#05070f;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:3vmin;text-align:center;padding:8vmin;z-index:50}
  #rot span{font-size:14vmin;animation:spin 1.8s ease-in-out infinite}
  @keyframes spin{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
  <div id="wrap"><canvas id="cv"></canvas></div>

  <div id="pad">
    <div class="btn" id="bBack">&#9664;</div>
    <div class="btn" id="bHit">HIT</div>
    <div class="btn" id="bJump">JUMP</div>
  </div>

  <div id="rot">
    <span>&#128241;</span>
    <h2 style="font-size:5vmin">Rotate your phone</h2>
    <p style="opacity:.6;font-size:3.6vmin">March to Ganabhaban is played in landscape.</p>
  </div>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
